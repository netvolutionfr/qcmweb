name: qcmweb

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant — copier .env.example vers .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant — copier .env.example vers .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant — copier .env.example vers .env}
    # Publié sur la seule boucle locale : accessible pour un client SQL sur la
    # machine, jamais depuis le réseau. En production, seul Nginx est exposé.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    # `build` sert au développement local, `image` à la production : la CI
    # construit et publie l'image, le serveur ne compile jamais (ADR-0014).
    image: ghcr.io/netvolutionfr/qcmweb-api:${IMAGE_TAG:-latest}
    build:
      context: ./api
    environment:
      # Nom de service Docker, et non localhost : la base est dans un autre
      # conteneur du même réseau.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BIND_ADDR: 0.0.0.0:3000
      TEACHER_USERNAME: ${TEACHER_USERNAME:?TEACHER_USERNAME manquant}
      TEACHER_PASSWORD_HASH: ${TEACHER_PASSWORD_HASH:?TEACHER_PASSWORD_HASH manquant}
      # Réseaux depuis lesquels X-Forwarded-For fait foi. Doit correspondre au
      # réseau réel depuis lequel Nginx atteint ce conteneur : une valeur trop
      # large laisse forger l'adresse du client, une valeur absente fait
      # compter toutes les tentatives de connexion ensemble.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS manquant — voir deploy/nginx.conf.example}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    # Idem : c'est Nginx, sur l'hôte, qui expose l'application au réseau et
    # termine TLS. L'API ne doit jamais être jointe directement.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/netvolutionfr/qcmweb-web:${IMAGE_TAG:-latest}
    build:
      context: ./web
    # Nginx, sur l'hôte, route `/` vers ce port et `/api/`, `/mcp` vers l'API.
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    healthcheck:
      # L'image node n'a pas curl : on sonde avec le runtime déjà présent.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/connexion').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
